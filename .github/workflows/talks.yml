name: Latest talks from the Academy Desk
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  talks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/pull_talks.py
      - run: python3 build.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/talks.json img/talks index.html zh/index.html
          git diff --cached --quiet || git commit -m "Latest talks from the Academy Desk"
          git pull --rebase origin main && git push
